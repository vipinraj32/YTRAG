[project]
name = "ytrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vipin singh", email = "vipendrarajpoot2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
]

[project.scripts]
ytrag = "ytrag:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
